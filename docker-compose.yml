services:
    testtask.api:
      container_name: testtask.api
      build:
        context: .
        dockerfile: docker/Dockerfile
        target: api-final
      ports:
        - "${PUBLIC_API_PORT}:8080"
      environment:
        - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
        - ConnectionStrings__ApplicationDatabaseConnection=Server=${DB_HOST};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True 
      depends_on:
        - sqlserver
      networks:
        - backend

    sqlserver:
      image: mcr.microsoft.com/mssql/server:2022-latest
      container_name: ${DB_HOST}
      environment:
        - SA_PASSWORD=${DB_PASSWORD}
        - ACCEPT_EULA=Y
      ports:
        - "${PUBLIC_DB_PORT}:1433"
      volumes:
        - sql_data:/var/opt/mssql
      networks:
        - backend
      healthcheck: 
        test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${DB_PASSWORD} -C -Q 'SELECT 1' || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 10s

    migrator:
      container_name: migrator
      restart: on-failure
      build:
        context: .
        dockerfile: docker/Dockerfile
        target: migrator-final
      entrypoint: ["./efbundle"]
      command: --connection "Server=${DB_HOST};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True"
      environment:
        - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      networks:
        - backend
      depends_on:
        sqlserver:
          condition: service_healthy

volumes:
  sql_data:

networks:
  backend:
